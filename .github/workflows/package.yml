name: package

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        description: "Release tag holding staging assets (rootfs-noboot, dex2oat-inputs, system.img, ...)"
        required: true
      final_tag:
        description: "Release tag to publish the final artifacts"
        required: true
      compat_tag:
        description: "Release tag holding compat_tool.tar.zst"
        required: false
        default: compat-tool-latest

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd coreutils

      - name: Download staging assets
        env:
          STAGING: ${{ inputs.staging_tag }}
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download "$STAGING" --dir staging --clobber \
            -p rootfs-noboot.tar.zst \
            -p dex2oat-inputs.tar.zst \
            -p build-manifest.json \
            -p system.img -p vendor.img -p NOTICE.txt
          ls -lh staging
          test -f staging/rootfs-noboot.tar.zst
          test -f staging/dex2oat-inputs.tar.zst

      - name: Generate boot image with dex2oat
        run: |
          set -euo pipefail
          mkdir -p staging/dex staging/boot
          tar --zstd -xf staging/dex2oat-inputs.tar.zst -C staging/dex
          bash staging/dex/dex2oat-inputs/run.sh "$PWD/staging/boot"
          echo "--- produced:"
          find staging/boot -type f -printf '%10s %p\n' | sort -n

      - name: Assemble rootfs
        run: |
          set -euo pipefail
          mkdir -p rootfs
          tar --zstd -xf staging/rootfs-noboot.tar.zst -C rootfs
          test -d rootfs/system/framework
          mkdir -p rootfs/system/framework/arm64
          cp -a staging/boot/system/framework/. rootfs/system/framework/
          # ART APEX core image: the runtime loads it before the framework image.
          mkdir -p rootfs/apex/com.android.art/javalib/arm64
          cp -a staging/dex/dex2oat-inputs/inputs/apex/com.android.art/javalib/arm64/. \
                rootfs/apex/com.android.art/javalib/arm64/
          ls -lh rootfs/system/framework/arm64
          ls -lh rootfs/apex/com.android.art/javalib/arm64
          tar --zstd -cf rootfs.tar.zst -C rootfs .
          ls -lh rootfs.tar.zst

      - name: Fetch compat tool
        env:
          COMPAT: ${{ inputs.compat_tag }}
        run: |
          set -euo pipefail
          if gh release download "$COMPAT" -p compat_tool.tar.zst -D . --clobber; then
            echo "compat_tool.tar.zst: $(stat -c %s compat_tool.tar.zst) bytes"
          else
            echo "::warning::compat_tool.tar.zst not found in $COMPAT"
          fi

      - name: Checksums and asset prep
        run: |
          set -euo pipefail
          mkdir -p publish
          cp rootfs.tar.zst publish/
          cp staging/system.img staging/vendor.img staging/NOTICE.txt publish/
          cp staging/build-manifest.json publish/
          [ -f compat_tool.tar.zst ] && cp compat_tool.tar.zst publish/
          ( cd publish && sha256sum * > SHA256SUMS && cat SHA256SUMS )
          ls -lh publish

      - name: Publish final release
        env:
          FINAL: ${{ inputs.final_tag }}
          STAGING: ${{ inputs.staging_tag }}
        run: |
          set -euo pipefail
          BODY=$(printf 'Lepton Android 11 rootfs, assembled by CI.\n\n- staging: %s\n- source commit: %s\n- debug symbols: see the staging release assets\n' "$STAGING" "$GITHUB_SHA")
          gh release view "$FINAL" >/dev/null 2>&1 || \
            gh release create "$FINAL" --title "Lepton Android 11 $FINAL" --notes "$BODY" --latest=false
          gh release upload "$FINAL" publish/* --clobber
          gh release view "$FINAL" --json assets --jq '.assets[] | "\(.name) \(.size)"'
